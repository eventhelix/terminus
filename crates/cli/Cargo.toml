[package]
name = "helixsim"
description = "helixsim: an open-source Rust discrete-event simulator for networking and wireless systems, with real-bytes PCAP capture for Wireshark and VisualEther analysis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "helixsim_cli"
path = "src/lib.rs"

[[bin]]
name = "helixsim"
path = "src/main.rs"

[dependencies]
helixsim-core = { path = "../core" }
helixsim-protocols = { path = "../protocols" }
nexosim.workspace = true
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
pcap-file.workspace = true
