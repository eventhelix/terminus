[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocols",
    "crates/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.79"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eventhelix/helixsim"
homepage = "https://github.com/eventhelix/helixsim"
authors = ["EventHelix.com Inc."]

[workspace.dependencies]
# DES engine
nexosim = "1.0"
# Real-bytes protocol encoding for standard layers
etherparse = "0.15"
# PDL runtime for generated codecs (exact pin — git main renamed error variants)
pdl-runtime = "=0.5.2"
bytes = "1"
# PCAPNG capture output
pcap-file = "2.0"
# Deterministic, seedable RNG
rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
# Config + traces
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"
sha2 = "0.10"
# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Diagnostics
thiserror = "1"
tracing = "0.1"

[profile.dev]
# pdl/nexosim codegen-heavy deps; keep test cycles snappy
opt-level = 0
